name: Build and Package Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      GYP_MSVS_VERSION: 2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Create backend .env from secrets
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          echo "PORT=3000" > .env
          echo "DATABASE_URL=\"file:./dev.db\"" >> .env
          echo "JWT_SECRET=\"$JWT_SECRET\"" >> .env
          echo "JWT_EXPIRES_IN=\"$JWT_EXPIRES_IN\"" >> .env
          echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\"" >> .env
          echo "GOOGLE_CLIENT_SECRET=\"$GOOGLE_CLIENT_SECRET\"" >> .env
          echo "GOOGLE_REDIRECT_URI=\"$GOOGLE_REDIRECT_URI\"" >> .env

      - name: Install and build backend
        working-directory: backend
        run: |
          npm install --include=dev --ignore-scripts
          npx prisma generate
          npm run build

      - name: Install and build frontend
        working-directory: frontend
        run: |
          echo "VITE_API_URL=http://localhost:3000" > .env
          npm install --include=dev
          npm run build

      - name: Install and build electron
        working-directory: electron
        run: |
          npm install --include=dev
          npm run build

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        working-directory: electron
        run: npm run dist:win

      - name: Build macOS Applications (DMG & ZIP)
        if: matrix.os == 'macos-latest'
        working-directory: electron
        run: npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinic-sync-${{ matrix.os }}
          path: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
          if-no-files-found: warn
